name: PKEA tests

on:
  push:
    paths:
      - '06_Product_Project_Knowledge_Evidence_Agent/**'
  pull_request:
    paths:
      - '06_Product_Project_Knowledge_Evidence_Agent/**'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PKEA
        working-directory: 06_Product_Project_Knowledge_Evidence_Agent
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
      - name: Run unit tests
        working-directory: 06_Product_Project_Knowledge_Evidence_Agent
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Run golden evaluation
        working-directory: 06_Product_Project_Knowledge_Evidence_Agent
        run: python evaluation/run_eval.py
