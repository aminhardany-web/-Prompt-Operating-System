name: PKEA tests

on:
  push:
    branches: [main]
    paths:
      - '06_Product_Project_Knowledge_Evidence_Agent/**'
      - '07_System_Integration/**'
      - 'sample_project/**'
      - '.github/workflows/pkea-tests.yml'
  pull_request:
    paths:
      - '06_Product_Project_Knowledge_Evidence_Agent/**'
      - '07_System_Integration/**'
      - 'sample_project/**'
      - '.github/workflows/pkea-tests.yml'
  workflow_dispatch:

# Evidence-first execution: a real run is required before CI closure is claimed.
# This workflow deliberately fails closed when the required runtime evidence is absent.
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Verify execution is running against the triggering commit
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$GITHUB_SHA"
          printf 'Verified commit: %s\n' "$actual"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate unified repository integration contract
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          manifest = Path('07_System_Integration/UNIFIED_REPOSITORY_INTEGRATION_MANIFEST.json')
          registry = Path('07_System_Integration/REPOSITORY_REGISTRY.md')
          contract = Path('07_System_Integration/INTEGRATION_ADAPTER_CONTRACT.md')
          evidence = Path('07_System_Integration/REPOSITORY_EXTRACTION_EVIDENCE.json')
          assert manifest.is_file() and manifest.stat().st_size > 0
          assert registry.is_file() and registry.stat().st_size > 0
          assert contract.is_file() and contract.stat().st_size > 0
          assert evidence.is_file() and evidence.stat().st_size > 0
          data = json.loads(manifest.read_text(encoding='utf-8'))
          extraction = json.loads(evidence.read_text(encoding='utf-8'))
          assert data['integration_mode'] == 'CONTROLLED_INTEROPERABILITY'
          assert data['source_of_truth'] == 'aminhardany-web/-Prompt-Operating-System'
          assert data['no_physical_merge'] is True
          repos = data['repositories']
          records = extraction['records']
          record_repos = {r['repository'] for r in records}
          manifest_repos = {r['repository'] for r in repos}
          assert manifest_repos == record_repos, (manifest_repos, record_repos)
          assert any(r['repository'] == 'aminhardany-web/data' and r['status'] == 'PRESERVE_AND_EXTRACT' for r in repos)
          assert any(r['repository'] == 'aminhardany-web/-Prompt-Operating-System' and r['status'] == 'INTEGRATED' for r in repos)
          for r in records:
              assert r['repository'] and r['source_ref'] and r['extraction_status'] and r['evidence_status'] and r['authority_status']
              if r['extraction_status'] not in ('EMPTY_REPOSITORY',):
                  assert r['source_path']
          print(f'Integration extraction registry PASS: {len(records)} repositories registered')
          print(f"Global extraction status: {extraction['global_status']}")
          PY
      - name: Install PKEA
        working-directory: 06_Product_Project_Knowledge_Evidence_Agent
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
      - name: Run unit tests
        working-directory: 06_Product_Project_Knowledge_Evidence_Agent
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Run golden evaluation
        working-directory: 06_Product_Project_Knowledge_Evidence_Agent
        run: python evaluation/run_eval.py
      - name: Run imported Library corpus evaluation
        working-directory: 06_Product_Project_Knowledge_Evidence_Agent
        run: python evaluation/run_library_eval.py
      - name: Run production CLI against canonical sample project
        working-directory: 06_Product_Project_Knowledge_Evidence_Agent
        run: |
          set -euo pipefail
          rm -rf /tmp/pkea-sample
          python -m pkea.cli run ../sample_project --output /tmp/pkea-sample
          test -s /tmp/pkea-sample/document_registry.json
          test -s /tmp/pkea-sample/analysis.json
          test -s /tmp/pkea-sample/report.md
          test -s /tmp/pkea-sample/run_summary.json
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('/tmp/pkea-sample')
          registry = json.loads((root / 'document_registry.json').read_text())
          analysis = json.loads((root / 'analysis.json').read_text())
          summary = json.loads((root / 'run_summary.json').read_text())
          documents = len(registry['documents'])
          claims = len(analysis['claims'])
          assert documents >= 3, documents
          assert claims >= 4, claims
          assert all(c['evidence']['path'] and c['evidence']['line_start'] for c in analysis['claims'])
          assert analysis['controls']['analysis_source'] == 'INGESTED_SNAPSHOT'
          assert analysis['controls']['human_gate_required'] is True
          assert summary['status'] == 'COMPLETED'
          evidence = {'gate':'PRODUCTION_CLI_SAMPLE','status':'PASS','documents':documents,'claims':claims,'run_status':summary['status'],'analysis_source':analysis['controls']['analysis_source'],'human_gate_required':analysis['controls']['human_gate_required']}
          (root / 'verification_evidence.json').write_text(json.dumps(evidence, indent=2) + '\n', encoding='utf-8')
          print(json.dumps(evidence, indent=2))
          PY
      - name: Run real PKEA CLI against the complete repository Library corpus
        working-directory: 06_Product_Project_Knowledge_Evidence_Agent
        run: |
          set -euo pipefail
          rm -rf /tmp/pkea-real-library
          python -m pkea.cli run ./resources/library --output /tmp/pkea-real-library
          test -s /tmp/pkea-real-library/document_registry.json
          test -s /tmp/pkea-real-library/analysis.json
          test -s /tmp/pkea-real-library/report.md
          test -s /tmp/pkea-real-library/run_summary.json
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('/tmp/pkea-real-library')
          registry = json.loads((root / 'document_registry.json').read_text())
          analysis = json.loads((root / 'analysis.json').read_text())
          summary = json.loads((root / 'run_summary.json').read_text())
          documents = len(registry['documents'])
          claims = len(analysis['claims'])
          assert documents >= 4, documents
          assert all(c['evidence']['path'] and c['evidence']['line_start'] for c in analysis['claims'])
          assert analysis['controls']['analysis_source'] == 'INGESTED_SNAPSHOT'
          assert analysis['controls']['human_gate_required'] is True
          assert analysis['controls']['canonicalization'] == 'PROHIBITED_IN_MVP'
          assert summary['status'] == 'COMPLETED'
          evidence = {'gate':'COMPLETE_REPOSITORY_LIBRARY_CORPUS','status':'PASS','documents':documents,'claims':claims,'run_status':summary['status'],'analysis_source':analysis['controls']['analysis_source'],'human_gate_required':analysis['controls']['human_gate_required'],'canonicalization':analysis['controls']['canonicalization']}
          (root / 'verification_evidence.json').write_text(json.dumps(evidence, indent=2) + '\n', encoding='utf-8')
          print(json.dumps(evidence, indent=2))
          PY
      - name: Upload production execution artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pkea-production-execution
          path: |
            /tmp/pkea-sample
            /tmp/pkea-real-library
          if-no-files-found: error
