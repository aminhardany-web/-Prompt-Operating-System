name: Runtime Connectivity Smoke

on:
  push:
    branches: [main, source-authority-sync-20260929]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  connectivity:
    runs-on: ubuntu-latest
    steps:
      - name: Verify runner
        run: |
          echo "GitHub Actions runner is operational."
          test -n "$GITHUB_SHA"
          test -n "$GITHUB_REPOSITORY"

      - name: Typecheck Prompt Bank MCP
        working-directory: 09_ChatGPT_Runtime/prompt-bank-mcp
        run: |
          npm install
          npm run check
