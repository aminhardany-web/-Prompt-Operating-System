name: PKEA Verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PKEA
        run: python -m pip install -e 06_Product_Project_Knowledge_Evidence_Agent
      - name: Unit and contract tests
        run: python -m unittest discover -s 06_Product_Project_Knowledge_Evidence_Agent/tests -v
      - name: Canonical CLI smoke test
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          mkdir -p "$tmp/source"
          printf '%s\n' '# Verification Fixture' 'Decision: Preserve source traceability.' 'Risk: unsupported claim.' > "$tmp/source/input.md"
          python -m pkea.cli run "$tmp/source" --output "$tmp/workspace"
          test -s "$tmp/workspace/document_registry.json"
          test -s "$tmp/workspace/analysis.json"
          test -s "$tmp/workspace/report.md"
          test -s "$tmp/workspace/run_summary.json"
          python -c 'import json, pathlib, sys; p=pathlib.Path(sys.argv[1]); analysis=json.loads((p/"analysis.json").read_text(encoding="utf-8")); summary=json.loads((p/"run_summary.json").read_text(encoding="utf-8")); assert analysis["controls"]["human_gate_required"] is True; assert analysis["controls"]["analysis_source"] == "INGESTED_SNAPSHOT"; assert summary["status"] == "COMPLETED"' "$tmp/workspace"
