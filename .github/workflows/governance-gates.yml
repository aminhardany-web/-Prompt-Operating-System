name: Governance gates

on:
  push:
    branches: [main]
    paths:
      - '00_Governance/**'
      - '01_Prompt_Library/**'
      - '02_Operations/**'
      - '03_Knowledge_Recovery/**'
      - '04_Projects/**'
      - '06_Product_Project_Knowledge_Evidence_Agent/**'
      - '07_System_Integration/**'
      - '.github/workflows/governance-gates.yml'
  pull_request:
    paths:
      - '00_Governance/**'
      - '01_Prompt_Library/**'
      - '02_Operations/**'
      - '03_Projects/**'
      - '04_Projects/**'
      - '06_Product_Project_Knowledge_Evidence_Agent/**'
      - '07_System_Integration/**'
      - '.github/workflows/governance-gates.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  governance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require canonical control documents
        run: |
          test -s 02_Operations/PORTFOLIO_CONTROL.md
          test -s 02_Operations/PROMPT_RUNTIME_GATE.md
          test -s 06_Product_Project_Knowledge_Evidence_Agent/FINAL_OPERATIONAL_BASELINE.md
      - name: Reject unsupported production authorization claims
        shell: bash
        run: |
          set -euo pipefail
          if grep -RniE 'Runtime Test *= *[1-9][0-9]*.*Production Release *= *AUTHORIZED|Production Release *= *AUTHORIZED.*Runtime Test *= *[1-9][0-9]*' 01_Prompt_Library 02_Operations 04_Projects 2>/dev/null; then
            echo 'Production authorization must not be asserted from runtime-test counts alone.'
            exit 1
          fi
          if grep -RniE 'Runtime Test *= *0.*Production Release *= *AUTHORIZED|Production Release *= *AUTHORIZED.*Runtime Test *= *0' 01_Prompt_Library 02_Operations 04_Projects 2>/dev/null; then
            echo 'Production authorization conflicts with zero runtime testing.'
            exit 1
          fi
      - name: Require evidence-first language in active governance
        run: |
          grep -q 'Narrative status alone is insufficient' 02_Operations/PORTFOLIO_CONTROL.md
          grep -q 'Production Release.*NOT AUTHORIZED' 02_Operations/PROMPT_RUNTIME_GATE.md
